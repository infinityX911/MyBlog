# nginx/blog.conf — host reverse proxy for the app container (127.0.0.1:3000).
# Put this on the VPS at /etc/nginx/sites-available/blog.conf, symlink it into
# sites-enabled, then run certbot (see DEPLOY.md) which rewrites this to add
# the HTTPS (443) block + certificate lines automatically.
#
# Replace your-domain.com with your real domain in BOTH places below.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Uploaded images can be up to UPLOAD_MAX_MB (default 8) — allow headroom.
    client_max_body_size 12M;

    # gzip text responses (nginx already handles static compression well).
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket upgrade — REQUIRED for Socket.io (real-time comments/chat).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.io long-polling + WebSocket — disable buffering so sessions don't
    # get a stale sid (which returns 400) and streams flush immediately.
    location /api/socket/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
